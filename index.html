                { hp: "340", kw: "250", runA: "466", startA: "712", breaker: "1000/700", mccb: "NF1000-SW", olHeater: "TH-N400 = 250A (200-300A)", olModel: "TH-N400", mcm: "S-N300", mcd: "S-N300", mcs: "S-N180", iec1: "(240#x3)x2, N-50#, G-50#", iec2: "(150#x3)x2, G-50#", cv1: "(150#x3)x2, N-50#, G-50#", cv2: "(185#x3)x2, G-50#", conn: "Star-Delta" },
                { hp: "420", kw: "315", runA: "580", startA: "870", breaker: "1000/900", mccb: "NF1000-SW", olHeater: "TH-N400 = 330A (260-400A)", olModel: "TH-N400", mcm: "S-N400", mcd: "S-N400", mcs: "S-N220", iec1: "(185#x3)x4, G-70#", iec2: "(150#x3)x4, G-70#", cv1: "(240#x3)x2, N-70#, G-70#", cv2: "(300#x3)x2, G-70#", conn: "Star-Delta" },
                { hp: "480", kw: "355", runA: "636", startA: "954", breaker: "1000/1000", mccb: "NF1000-SW", olHeater: "TH-N400 = 330A (260-400A)", olModel: "TH-N400", mcm: "S-N400", mcd: "S-N400", mcs: "S-N220", iec1: "(240#x3)x3, N-70#, G-70#", iec2: "(185#x3)x4, G-70#", cv1: "(240#x3)x2, N-70#, G-70#", cv2: "(300#x3)x2, G-70#", conn: "Star-Delta" },
                { hp: "540", kw: "400", runA: "710", startA: "1065", breaker: "1250/1200", mccb: "NF1250-SW", olHeater: "TH-N600 = 500A (400-600A)", olModel: "TH-N600", mcm: "S-N600", mcd: "S-N600", mcs: "S-N220", iec1: "(240#x3)x3, N-95#, G-95#", iec2: "(185#x3)x4, G-95#", cv1: "(300#x3)x2, N-95#, G-95#", cv2: "(120#x3)x4, G-95#", conn: "Star-Delta" },
                { hp: "600", kw: "450", runA: "800", startA: "1200", breaker: "1250/1200", mccb: "NF1250-SW", olHeater: "TH-N600 = 500A (400-600A) CT 750/5A 15VA", olModel: "TH-N600", mcm: "S-N600", mcd: "S-N600", mcs: "S-N300", iec1: "(300#x3)x3, N-95#, G-95#", iec2: "(240#x3)x3, G-95#", cv1: "(185#x3)x3x2, G-95#", cv2: "(150#x3)x4, G-95#", conn: "Star-Delta" }
            ];

            // Calculations Logic
            const finalRpm = useMemo(() => {
                const motorSpeed = (motorRpm || 0) * ((hz || 0) / 50);
                let current = ratio > 0 ? motorSpeed / ratio : motorSpeed;
                if (d1 > 0 && d2 > 0) current = (current * d1) / d2;
                if (z1 > 0 && z2 > 0) current = (current * z1) / z2;
                return current;
            }, [hz, motorRpm, ratio, d1, d2, z1, z2]);

            const pmResult = useMemo(() => {
                if (!pmAmp || !pmCt) return null;
                const percent = (pmAmp / pmCt) * 100;
                let sd, od;
                if(pmLoad === 'small') { sd = 3; od = 2; }
                else if(pmLoad === 'medium') { sd = 7; od = 3; }
                else { sd = 12; od = 5; }
                return { percent: percent.toFixed(1), sd, od };
            }, [pmAmp, pmCt, pmLoad]);

            // ฟังก์ชันวิเคราะห์เฟรมจากระยะ A และ B
            const analyzeFrame = () => {
                if (!measureA || !measureB) return null;
                const a = parseInt(measureA);
                const b = parseInt(measureB);
                const matches = motorSpecsData.filter(m => m.dimA === a && m.dimB === b);
                
                if (matches.length > 0) {
                    const uniqueFrames = [...new Set(matches.map(m => m.frame))];
                    const frameInfoStrings = uniqueFrames.map(fname => {
                        const hpsForThisFrame = motorSpecsData
                            .filter(m => m.frame === fname)
                            .map(m => m.hp);
                        return `${fname} (${hpsForThisFrame.join(', ')} HP)`;
                    });

                    return `✅ ตรงกับเฟรม: ${frameInfoStrings.join(' หรือ ')}`;
                }
                return "❌ ไม่พบข้อมูลเฟรม";
            };

            const sortedSizes = useMemo(() => {
                const data = wireType === 'VCT' ? wireMasterData['VCT'][cores] : wireMasterData[wireType];
                return Object.keys(data).sort((a, b) => Number(a) - Number(b));
            }, [wireType, cores]);

            const currentWireData = useMemo(() => {
                if (wireType === 'VCT') return wireMasterData['VCT'][cores][wireSize] || {m:0, e:0};
                return wireMasterData[wireType][wireSize] || {m:0, e:0};
            }, [wireType, cores, wireSize]);

            const currentMotor = useMemo(() => motorSpecsData.find(m => m.hp === selectedHp) || motorSpecsData[0], [selectedHp]);
            const currentMcc = useMemo(() => mccMasterData.find(m => m.hp === selectedMccHp) || mccMasterData[0], [selectedMccHp]);

            return (
                <div className="max-w-md mx-auto p-4 pb-20 space-y-4">
                    {/* ส่วนแสดงผลความเร็วรอบ */}
                    <div className="bg-slate-900 border-b-4 border-emerald-500 p-6 rounded-2xl shadow-2xl text-center mb-6">
                        <p className="text-emerald-500 text-[10px] font-black uppercase mb-1 tracking-widest">ความเร็วรอบปลายทาง</p>
                        <div className="text-6xl font-black text-white">{finalRpm.toLocaleString(undefined, {maximumFractionDigits:1})}</div>
                        <p className="text-slate-500 text-xs font-bold uppercase">RPM</p>
                    </div>

                    {/* 1. มอเตอร์และเกียร์ */}
                    <CollapsibleSection 
                        title="1. มอเตอร์และเกียร์" 
                        containerClassName="bg-slate-800/30 rounded-2xl border border-slate-700"
                        titleClassName="text-yellow-500 font-bold text-lg uppercase"
                    >
                        <div className="space-y-3">
                            <InputGroup label="ความถี่อินเวอร์เตอร์" value={hz} onChange={setHz} unit="Hz" icon="⚡" color="yellow" />
                            <div className="grid grid-cols-2 gap-2">
                                <InputGroup label="รอบเนมเพลท" value={motorRpm} onChange={setMotorRpm} unit="RPM" icon="🔄" color="emerald" />
                                <InputGroup label="อัตราทดเกียร์" value={ratio} onChange={setRatio} unit="1:X" icon="⚙️" color="emerald" />
                            </div>
                        </div>
                    </CollapsibleSection>

                    {/* 2. มู่เล่ย์และเฟือง */}
                    <CollapsibleSection 
                        title="2. มู่เล่ย์และเฟือง (ใส่ 0 เพื่อข้าม)" 
                        defaultOpen={false}
                        containerClassName="bg-slate-800/30 rounded-2xl border border-slate-700"
                        titleClassName="text-sky-400 font-bold text-lg uppercase italic"
                    >
                        <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2"><InputGroup label="ขับ D1" value={d1} onChange={setD1} unit="นิ้ว" icon="🔘" color="sky" /><InputGroup label="ตาม D2" value={d2} onChange={setD2} unit="นิ้ว" icon="🔘" color="sky" /></div>
                            <div className="grid grid-cols-2 gap-2"><InputGroup label="เฟืองขับ Z1" value={z1} onChange={setZ1} unit="ฟัน" icon="⛓️" color="indigo" /><InputGroup label="เฟืองตาม Z2" value={z2} onChange={setZ2} unit="ฟัน" icon="⛓️" color="indigo" /></div>
                        </div>
                    </CollapsibleSection>

                    {/* 3. เช็คขนาดสายไฟ */}
                    <CollapsibleSection 
                        title="3. เช็คขนาดสายไฟ" 
                        defaultOpen={false}
                        containerClassName="bg-orange-950/10 rounded-2xl border border-orange-500/30"
                        titleClassName="text-orange-500 font-bold text-lg uppercase"
                    >
                        <div className="space-y-3 mb-4">
                            <select value={wireType} onChange={(e) => setWireType(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-3 rounded text-xs font-bold text-white outline-none">
                                <option value="THW">THW (แกนเดี่ยว)</option><option value="VCT">VCT (สายอ่อน/มอเตอร์)</option><option value="NYY">NYY (ฝังดิน)</option><option value="THW-A">THW-A (อะลูมิเนียม)</option>
                            </select>
                            {wireType === 'VCT' && (
                                <div className="flex gap-2">
                                    {[2, 3, 4].map(c => (
                                        <button key={c} onClick={() => setCores(c)} className={`flex-1 py-2 rounded text-[10px] font-bold border ${cores === c ? 'bg-orange-600 border-orange-400 text-white' : 'bg-slate-950 border-slate-700 text-slate-500'}`}>{c} Core</button>
                                    ))}
                                </div>
                            )}
                            <select value={wireSize} onChange={(e) => setWireSize(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 p-3 rounded text-xs font-bold text-white outline-none">
                                {sortedSizes.map(s => <option key={s} value={s}>{s} sq.mm.</option>)}
                            </select>
                        </div>
                        <div className="grid grid-cols-2 gap-2 mt-4">
                            <div className="bg-slate-950 p-3 rounded border border-slate-800 text-center"><p className="text-[8px] text-slate-500 uppercase">ในท่อ/ราง</p><p className="text-2xl font-black text-orange-500">{currentWireData.m}A</p></div>
                            <div className="bg-slate-950 p-3 rounded border border-slate-800 text-center"><p className="text-[8px] text-slate-500 uppercase">เดินลอย</p><p className="text-2xl font-black text-sky-400">{currentWireData.e}A</p></div>
                        </div>
                    </CollapsibleSection>

                    {/* 4. ข้อมูลสเปคมอเตอร์ */}
                    <CollapsibleSection 
                        title="4. ข้อมูลสเปคมอเตอร์ (3 Phase)" 
                        defaultOpen={false}
                        containerClassName="bg-blue-950/20 rounded-2xl border border-blue-500/30"
                        titleClassName="text-blue-400 font-bold text-lg uppercase"
                    >
                        <select value={selectedHp} onChange={(e) => setSelectedHp(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-3 rounded text-sm font-bold text-white mb-4">
                            {motorSpecsData.map(m => <option key={m.hp} value={m.hp}>{m.label || m.hp} HP</option>)}
                        </select>
                        <div className="bg-slate-900 rounded-xl p-3 border border-slate-800 space-y-3">
                            <div className="grid grid-cols-3 gap-2 text-center pb-2 border-b border-slate-800">
                                <div><p className="text-[9px] text-slate-500">เฟรม</p><p className="text-sm font-bold">{currentMotor.frame}</p></div>
                                <div className="border-x border-slate-800"><p className="text-[9px] text-slate-500">กระแส</p><p className="text-sm font-bold text-red-400">{currentMotor.amp} A</p></div>
                                <div><p className="text-[9px] text-slate-500">เพลา/ลิ่ม</p><p className="text-sm font-bold text-sky-300">Ø{currentMotor.shaft} / {currentMotor.key}</p></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-center pb-2 border-b border-slate-800">
                                <div><p className="text-[9px] text-slate-500">ลูกปืน DE (หน้า)</p><p className="text-sm font-bold text-emerald-400">{currentMotor.de}</p></div>
                                <div className="border-l border-slate-800"><p className="text-[9px] text-slate-500">ลูกปืน NDE (หลัง)</p><p className="text-sm font-bold text-emerald-400">{currentMotor.nde}</p></div>
                            </div>
                            <div className="flex justify-around text-center">
                                <div><p className="text-[9px] text-slate-500">รูกว้าง (A)</p><p className="text-lg font-bold">{currentMotor.dimA} mm</p></div>
                                <div><p className="text-[9px] text-slate-500">รูยาว (B)</p><p className="text-lg font-bold">{currentMotor.dimB} mm</p></div>
                            </div>
                            
                            <div className="flex gap-2 mt-3">
                                <input type="number" placeholder="เช็ค A" value={measureA} onChange={(e)=>setMeasureA(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs font-bold outline-none" />
                                <input type="number" placeholder="เช็ค B" value={measureB} onChange={(e)=>setMeasureB(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs font-bold outline-none" />
                            </div>
                            {analyzeFrame() && <div className="p-2 bg-blue-500/20 rounded text-blue-300 text-[11px] font-bold text-center mt-2">{analyzeFrame()}</div>}
                        </div>
                    </CollapsibleSection>

                    {/* 5. Primus PM-001 SMART CONFIG */}
<CollapsibleSection 
    title="5. Primus PM-001 SMART CONFIG" 
    defaultOpen={false}
    containerClassName="bg-purple-950/20 rounded-2xl border border-purple-500/30"
    titleClassName="text-purple-400 font-bold text-lg uppercase"
>
    <div className="space-y-3">
        
        {/* 👉 แก้ตรงนี้: ทำเป็น 2 ช่อง */}
        <div className="grid grid-cols-2 gap-2">
            <InputGroup 
                label="กระแสใช้งานจริง (Amp)" 
                value={pmAmp} 
                onChange={setPmAmp} 
                unit="A" 
                icon="⚡" 
                color="purple" 
            />
            <InputGroup 
                label="ขนาด CT" 
                value={pmCt} 
                onChange={setPmCt} 
                unit="/5A" 
                icon="🧲" 
                color="purple" 
            />
        </div>

        {/* โหลด */}
        <select 
            value={pmLoad} 
            onChange={(e) => setPmLoad(e.target.value)} 
            className="w-full bg-slate-950 border border-slate-700 p-3 rounded text-xs font-bold text-white outline-none"
        >
            <option value="small">โหลดเบา (พัดลม, ปั๊มน้ำเล็ก)</option>
            <option value="medium">โหลดปานกลาง (สายพาน, ปั๊มใหญ่)</option>
            <option value="heavy">โหลดหนัก (บด, อัด, ยก)</option>
        </select>

        {pmResult && (
            <div className="bg-slate-900 rounded-xl p-3 border border-slate-800 text-center">
                <p className="text-sm text-slate-400 mb-1">
                    เปอร์เซ็นต์โหลด: 
                    <span className="text-purple-400 font-bold"> {pmResult.percent}%</span>
                </p>

                <div className="grid grid-cols-2 gap-2 mt-2">
                    <div className="bg-slate-950 p-2 rounded border border-slate-800">
                        <p className="text-[10px] text-slate-500">Start Delay (Sd)</p>
                        <p className="text-lg font-bold text-emerald-400">{pmResult.sd} s</p>
                    </div>
                    <div className="bg-slate-950 p-2 rounded border border-slate-800">
                        <p className="text-[10px] text-slate-500">Over Delay (od)</p>
                        <p className="text-lg font-bold text-red-400">{pmResult.od} s</p>
                    </div>
                </div>
            </div>
        )}
    </div>
</CollapsibleSection>

                    {/* 6. สเปคตู้ MCC & สายไฟ */}
                    <CollapsibleSection 
                        title="6. สเปคตู้ MCC & สายไฟ" 
                        defaultOpen={false}
                        containerClassName="bg-rose-950/20 rounded-2xl border border-rose-500/30"
                        titleClassName="text-rose-400 font-bold text-lg uppercase"
                    >
                        <select value={selectedMccHp} onChange={(e) => setSelectedMccHp(e.target.value)} className="w-full bg-slate-950 border border-slate-700 p-3 rounded text-sm font-bold text-white mb-4">
                            {mccMasterData.map(m => <option key={m.hp} value={m.hp}>{m.hp} HP ({m.kw} kW)</option>)}
                        </select>
                        <div className="bg-slate-900 rounded-xl p-3 border border-slate-800 space-y-3">
                            <div className="grid grid-cols-2 gap-2 text-center pb-2 border-b border-slate-800">
                                <div><p className="text-[9px] text-slate-500">พิกัดกระแส (Run)</p><p className="text-sm font-bold text-emerald-400">{currentMcc.runA} A</p></div>
                                <div className="border-l border-slate-800"><p className="text-[9px] text-slate-500">กระแสสตาร์ท (Start)</p><p className="text-sm font-bold text-red-400">{currentMcc.startA} A</p></div>
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-center pb-2 border-b border-slate-800">
                                <div><p className="text-[9px] text-slate-500">Breaker</p><p className="text-xs font-bold">{currentMcc.breaker} ({currentMcc.mccb})</p></div>
                                <div className="border-l border-slate-800"><p className="text-[9px] text-slate-500">ระบบสตาร์ท</p><p className="text-xs font-bold text-sky-400">{currentMcc.conn}</p></div>
                            </div>
                            <div className="text-center pb-2 border-b border-slate-800">
                                <p className="text-[9px] text-slate-500">Overload Relay</p>
                                <p className="text-xs font-bold text-yellow-400">{currentMcc.olHeater}</p>
                            </div>
                            <div className="grid grid-cols-3 gap-1 text-center pb-2 border-b border-slate-800">
                                <div><p className="text-[9px] text-slate-500">Main</p><p className="text-xs font-bold">{currentMcc.mcm}</p></div>
                                <div className="border-x border-slate-800"><p className="text-[9px] text-slate-500">Delta</p><p className="text-xs font-bold">{currentMcc.mcd}</p></div>
                                <div><p className="text-[9px] text-slate-500">Star</p><p className="text-xs font-bold">{currentMcc.mcs}</p></div>
                            </div>
                            <div className="text-center space-y-2 pt-1">
                                <div><p className="text-[9px] text-slate-500">สายไฟ IEC (ท่อ/ราง)</p><p className="text-[11px] font-bold text-orange-300">{currentMcc.iec1}</p><p className="text-[11px] font-bold text-orange-300">{currentMcc.iec2 !== "-" && currentMcc.iec2}</p></div>
                                <div><p className="text-[9px] text-slate-500">สายไฟ CV (ลอย/ฝัง)</p><p className="text-[11px] font-bold text-blue-300">{currentMcc.cv1}</p><p className="text-[11px] font-bold text-blue-300">{currentMcc.cv2 !== "-" && currentMcc.cv2}</p></div>
                            </div>
                        </div>
                    </CollapsibleSection>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
